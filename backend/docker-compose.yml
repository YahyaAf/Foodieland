version: '3.8'

services:
  postgres:
    image:  postgres:15-alpine
    container_name: recipe-postgres
    restart: always
    environment:
      POSTGRES_DB: recipe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recipe-network
    healthcheck:
      test:  ["CMD-SHELL", "pg_isready -U postgres"]
      interval:  10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recipe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@recipe.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - recipe-network
volumes:
  postgres_data:

networks:
  recipe-network:
    driver: bridge